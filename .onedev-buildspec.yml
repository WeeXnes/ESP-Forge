version: 43
jobs:
- name: gradle ci
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: gradle init
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        gradle init
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: gradle setupCiWorkspace
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        gradle setupCiWorkspace
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: gradle build
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        gradle build
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: Publish Jars
    sourcePath: build/libs
    artifacts: '*'
    condition: SUCCESSFUL
    optional: false
  jobExecutor: Builder
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
